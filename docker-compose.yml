services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: utrgv_match
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # "db" here is the docker-compose service name above, not localhost —
      # containers reach each other by service name on the compose network
      DATABASE_URL: postgres://postgres:postgres@db:5432/utrgv_match
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
